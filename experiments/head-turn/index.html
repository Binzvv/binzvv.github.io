<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Binz Tamang · Head-turn experiment</title>
  <meta name="description" content="Binz Tamang — Brand. Product. What’s next." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#2a8ced" />
  <link rel="preload" as="image" href="still.webp" fetchpriority="high" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="../../style.css" />
  <link rel="stylesheet" href="head-turn.css" />
  <noscript><style>.is-loading .head-enter, .is-loading [data-reveal] { opacity: 1; }</style></noscript>
</head>
<body class="is-loading">
  <div class="sky" aria-hidden="true">
    <div class="clouds" id="clouds"></div>
  </div>

  <!-- Teaser tiles sit behind the head so it occludes them as they emerge -->
  <div class="tiles" id="tiles" aria-hidden="true"></div>

  <main class="intro" id="intro">
    <div class="stage">
      <!-- entrance / idle float / perspective / look-up-down tilt each own one transform;
           head turning happens inside the canvas by choosing a rendered pose -->
      <div class="head-enter" id="headEnter">
        <div class="head-float" id="headFloat">
          <div class="head-follow" id="headFollow">
            <div class="head-tilt" id="headTilt">
              <div class="head head-video" id="head">
                <img class="face still" id="still" src="still.webp" width="469" height="605" alt="Portrait of Binz Tamang as a glossy designer toy: curly hair with star, heart and flower clips, silver glasses and piercings" fetchpriority="high" decoding="async" />
                <canvas class="face frames" id="frames" aria-hidden="true"></canvas>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="copy">
      <h1 class="name" data-reveal>Binz Tamang</h1>
      <p class="tagline" data-reveal>Brand. Product. What’s next.</p>
      <p class="soon" data-reveal>Coming soon</p>
    </div>
  </main>

  <script src="../../assets/vendor/gsap.min.js"></script>
  <script src="head-turn.js"></script>
</body>
</html>
