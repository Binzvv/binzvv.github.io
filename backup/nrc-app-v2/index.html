<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>NRC · Energy in Motion</title>
  <meta name="description" content="An unofficial, speculative Nike Run Club concept: energy in motion." />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NRC Energy" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <link rel="icon" type="image/png" href="assets/icon-192.png" />
  <link rel="preload" href="fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/barlow-cond-600.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles/app.css" />
</head>
<body>
  <canvas id="gl" aria-hidden="true"></canvas>

  <main id="app" data-state="boot">

    <!-- ── 01 ANTICIPATION ─────────────────────────────────────────────── -->
    <section class="screen home" data-screen="home" aria-label="Your next run">
      <header class="brand" data-reveal>
        <img class="swoosh" src="assets/swoosh.png" width="1464" height="512" alt="Nike" />
        <span class="brand-name">
          <img class="nrc-logo" src="assets/nrc-logo.svg" alt="Nike Run Club" hidden />
          <span class="nrc-text">Run Club</span>
        </span>
      </header>

      <div class="intro dissolve">
        <p class="eyebrow split" data-text="Your next run"></p>
        <h1 class="headline split" data-text="Ready|to go?"></h1>
        <p class="lede split" data-text="Every run starts with you."></p>
        <button class="goal-chip" id="goalChip" type="button" hidden>
          <span class="dot" aria-hidden="true"></span><span class="goal-chip-label">Goal</span>
          <span class="goal-chip-value" id="goalChipValue"></span>
        </button>
      </div>

      <div class="stage" id="stage" aria-hidden="true"></div>

      <div class="actions" data-reveal>
        <button class="btn btn-primary" id="startBtn" type="button">
          <span class="btn-label">Start Run</span>
        </button>
        <button class="btn btn-secondary" id="goalBtn" type="button">Set a goal</button>
      </div>
    </section>

    <!-- ── 04 COUNTDOWN ────────────────────────────────────────────────── -->
    <section class="screen countdown" data-screen="countdown" aria-live="assertive">
      <p class="count-caption" id="countCaption">Starting in</p>
      <div class="count" id="count"></div>
    </section>

    <!-- ── 05 ACTIVE RUN ───────────────────────────────────────────────── -->
    <section class="screen run" data-screen="run" aria-label="Active run">
      <header class="run-top" data-in>
        <img class="swoosh small" src="assets/swoosh.png" width="1464" height="512" alt="Nike" />
        <span class="status" id="runStatus"><span class="dot" aria-hidden="true"></span><span id="runStatusText">Running</span></span>
      </header>

      <div class="hero-metric" data-in>
        <div class="hero-value" id="heroValue">0.00</div>
        <div class="hero-label" id="heroLabel">Kilometres</div>
      </div>

      <div class="goal-progress" id="goalProgress" data-in hidden>
        <div class="goal-progress-row"><span id="goalProgressLabel">Goal</span><span id="goalProgressValue"></span></div>
        <div class="goal-track"><div class="goal-fill" id="goalFill"></div></div>
      </div>

      <dl class="metrics" data-in>
        <div class="metric"><dd id="m1v">-'--"</dd><dt id="m1l">Pace</dt></div>
        <div class="metric"><dd id="m2v">00:00</dd><dt id="m2l">Time</dt></div>
        <div class="metric"><dd id="m3v">--</dd><dt id="m3l">BPM</dt></div>
      </dl>

      <div class="run-controls" data-in>
        <button class="pause-btn" id="pauseBtn" type="button" aria-label="Pause run">
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4.8v14.4c0 .8.9 1.3 1.6.8l11-7.2c.6-.4.6-1.2 0-1.6l-11-7.2C8.9 3.5 8 4 8 4.8z"/></svg>
        </button>
        <button class="btn btn-end" id="endBtn" type="button"><span class="hold-fill" aria-hidden="true"></span><span class="btn-label" id="endLabel">End Run</span></button>
        <p class="hint" id="endHint" aria-live="polite"></p>
      </div>
    </section>

    <!-- ── 06 COMPLETION ───────────────────────────────────────────────── -->
    <section class="screen summary" data-screen="summary" aria-label="Run summary">
      <header class="brand" data-in>
        <img class="swoosh" src="assets/swoosh.png" width="1464" height="512" alt="Nike" />
        <span class="brand-name"><span class="nrc-text">Run Club</span></span>
      </header>
      <div class="summary-space" aria-hidden="true"></div>
      <div class="summary-body">
        <p class="eyebrow" id="runName" data-in>Morning Run</p>
        <h2 class="headline summary-title split dissolve" data-text="You|showed|up."></h2>
        <dl class="metrics summary-metrics" data-in>
          <div class="metric"><dd id="sDist">0.00</dd><dt>Kilometres</dt></div>
          <div class="metric"><dd id="sPace">-'--"</dd><dt>Avg. Pace</dt></div>
          <div class="metric"><dd id="sTime">00:00</dd><dt>Time</dt></div>
        </dl>
        <div class="summary-actions" data-in>
          <button class="btn btn-secondary" id="doneBtn" type="button">Done</button>
          <button class="btn btn-primary" id="againBtn" type="button"><span class="btn-label">Run Again</span></button>
        </div>
      </div>
    </section>

    <!-- ── GOAL SHEET ──────────────────────────────────────────────────── -->
    <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
    <section class="sheet" id="goalSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 id="sheetTitle">Set a goal</h2>
        <button class="icon-btn" id="sheetClose" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="segmented" role="tablist" aria-label="Goal type">
        <button role="tab" id="segDistance" aria-selected="true" type="button">Distance</button>
        <button role="tab" id="segTime" aria-selected="false" type="button">Time</button>
      </div>
      <div class="goal-dial">
        <button class="step" id="stepDown" type="button" aria-label="Decrease"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
        <div class="goal-readout" id="goalReadout" aria-live="polite">
          <div class="goal-value" id="goalValue">5.00</div>
          <div class="goal-unit" id="goalUnit">Kilometres</div>
        </div>
        <button class="step" id="stepUp" type="button" aria-label="Increase"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div class="presets" id="presets"></div>
      <div class="sheet-actions">
        <button class="btn btn-primary" id="setGoalBtn" type="button"><span class="btn-label">Set Goal</span></button>
        <button class="btn-text" id="clearGoalBtn" type="button" hidden>Remove goal</button>
      </div>
    </section>

    <p class="concept-note" data-reveal>Unofficial concept · Not affiliated with Nike</p>
  </main>

  <script src="vendor/gsap.min.js"></script>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
