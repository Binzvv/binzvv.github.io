<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Binz Tamang</title>
  <meta name="description" content="Binz Tamang — Brand. Product. What’s next." />
  <meta name="theme-color" content="#0a0a0b" />
  <link rel="preload" as="image" href="assets/head.webp" fetchpriority="high" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="style.css" />
  <noscript><style>.is-loading .head-enter, .is-loading [data-reveal] { opacity: 1; }</style></noscript>
</head>
<body class="is-loading">
  <div class="atmosphere" aria-hidden="true"></div>

  <!-- One stacking context for the archive and the head, so cards can pass behind and in front of it -->
  <main class="space" id="space">
    <div class="archive" id="archive" role="group" aria-label="Project archive"></div>
    <div class="card-label" id="cardLabel" aria-hidden="true">View project <span class="card-label-arrow">→</span></div>

    <div class="anchor" id="anchor">
      <div class="stage">
        <!-- Each wrapper owns one transform so entrance, float, follow and tilt never overwrite each other -->
        <div class="head-enter" id="headEnter">
          <div class="head-float" id="headFloat">
            <div class="head-follow" id="headFollow">
              <div class="head-tilt" id="headTilt">
                <div class="head" id="head">
                  <img class="socket socket-l" src="assets/socket-l.webp" alt="" decoding="async" />
                  <img class="socket socket-r" src="assets/socket-r.webp" alt="" decoding="async" />
                  <div class="eye eye-l"><img class="iris" src="assets/iris-l.webp" alt="" decoding="async" /><img class="catch" src="assets/catch-l.webp" alt="" decoding="async" /></div>
                  <div class="eye eye-r"><img class="iris" src="assets/iris-r.webp" alt="" decoding="async" /><img class="catch" src="assets/catch-r.webp" alt="" decoding="async" /></div>
                  <img class="face" src="assets/head.webp" width="776" height="1215" alt="Portrait of Binz Tamang as a glossy designer toy: curly hair with star, heart and flower clips, silver glasses and piercings" fetchpriority="high" decoding="async" />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <header class="credit">
      <h1 class="name" data-reveal>Binz Tamang</h1>
      <p class="tagline" data-reveal>Brand. Product. What’s next.</p>
    </header>
  </main>

  <!-- Fullscreen project image; the figure flies in from the card that was opened -->
  <div class="viewer" id="viewer" tabindex="-1" role="dialog" aria-modal="true" aria-label="Project image" hidden>
    <div class="viewer-backdrop" id="viewerBackdrop"></div>
    <div class="viewer-figure" id="viewerFigure">
      <img class="viewer-img" id="viewerImg" alt="" />
      <div class="viewer-placeholder" id="viewerPlaceholder" hidden><span id="viewerPlaceholderLabel"></span></div>
      <div class="viewer-shade" id="viewerShade"></div>
    </div>
    <div class="viewer-meta" id="viewerMeta" data-viewer-ui>
      <p class="viewer-title" id="viewerTitle"></p>
      <p class="viewer-caption" id="viewerCaption" hidden></p>
    </div>
    <p class="viewer-count" id="viewerCount" aria-live="polite" data-viewer-ui></p>
    <button class="viewer-nav viewer-prev" id="viewerPrev" type="button" aria-label="Previous image" data-viewer-ui>
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 4l-8 8 8 8" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg>
    </button>
    <button class="viewer-nav viewer-next" id="viewerNext" type="button" aria-label="Next image" data-viewer-ui>
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 4l8 8-8 8" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round" /></svg>
    </button>
    <button class="viewer-close" id="viewerClose" type="button" aria-label="Close project image" data-viewer-ui>
      <span>Close</span>
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" /></svg>
    </button>
  </div>

  <script src="assets/vendor/gsap.min.js"></script>
  <script src="projects.js"></script>
  <script src="script.js"></script>
</body>
</html>
