<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AFTER HOURS 24:7 — Ident Master</title>
<!--
  AFTER HOURS 24:7 — 12s kinetic ident
  ------------------------------------
  One <canvas> = the comp. One GSAP timeline = the timeline panel.
  Every visual property lives in a plain state object (S). The master timeline
  only ever writes numbers into S; render() draws S. Scrub the timeline and the
  picture follows, frame-accurate, in either direction.

  THE LOGO: the supplied PNG is embedded below as base64, untouched. At boot its
  alpha channel is traced along the 50%-coverage contour (marching squares, linear
  interpolation between the original pixels), so the artwork can be pushed to
  6000% scale without turning to mush. Nothing is redrawn or re-typeset: the
  outline IS the supplied pixels. Press P to render the raw bitmap instead for comparison.
-->
<style>
  :root{
    --k:#0b0b0b; --r:#ff0000; --w:#f1ece2;
    --hair:rgba(241,236,226,.16); --dim:rgba(241,236,226,.5);
    --strip:46px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--k);overflow:hidden;overscroll-behavior:none}
  #comp{position:fixed;left:0;top:0;width:100vw;height:calc(100dvh - var(--strip));display:block;background:var(--k)}

  /* ---------- transport strip ---------- */
  #strip{position:fixed;left:0;right:0;bottom:0;height:var(--strip);display:flex;align-items:stretch;
    background:var(--k);color:var(--w);border-top:1px solid var(--hair);
    font:500 10.5px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;letter-spacing:.08em;
    text-transform:uppercase;user-select:none;-webkit-user-select:none;padding-bottom:env(safe-area-inset-bottom)}
  .cell{display:flex;align-items:center;border-right:1px solid var(--hair);white-space:nowrap}
  .btn{appearance:none;border:0;border-right:1px solid var(--hair);background:none;color:var(--w);
    min-width:44px;padding:0 12px;display:grid;place-items:center;cursor:pointer;font:inherit;letter-spacing:inherit}
  .btn:hover{background:rgba(241,236,226,.07)}
  .btn:focus-visible{outline:1px solid var(--r);outline-offset:-3px}
  .btn svg{width:12px;height:12px;fill:currentColor;display:block}
  .btn.on{background:var(--w);color:var(--k)}
  .tc{text-transform:none;padding:0 14px;gap:6px;font-variant-numeric:tabular-nums;min-width:128px}
  .tc .now{color:var(--w);font-weight:700}
  .tc .dur{color:var(--dim)}
  .lbl{padding:0 12px;color:var(--dim)}
  #track{position:relative;flex:1;min-width:120px;cursor:ew-resize;touch-action:none;overflow:hidden;border-right:1px solid var(--hair)}
  #track .secs{position:absolute;left:0;right:0;top:0;height:15px;border-bottom:1px solid var(--hair)}
  #track .sec{position:absolute;top:0;bottom:0;border-left:1px solid var(--hair);padding:3px 0 0 4px;
    font-size:8.5px;color:var(--dim);overflow:hidden;white-space:nowrap}
  #track .ticks{position:absolute;left:0;right:0;top:15px;bottom:0}
  #track .tk{position:absolute;bottom:0;width:1px;background:var(--hair);height:5px}
  #track .tk.s{height:10px;background:var(--dim)}
  #track .tk i{position:absolute;left:3px;bottom:12px;font-style:normal;font-size:8.5px;color:var(--dim)}
  #cti{position:absolute;top:0;bottom:0;left:0;width:0;pointer-events:none;will-change:transform}
  #cti::before{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;background:var(--r)}
  #cti::after{content:"";position:absolute;top:0;left:-5px;width:10px;height:9px;background:var(--r);
    clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%)}
  #prog{position:absolute;left:0;top:15px;bottom:0;width:100%;background:rgba(255,0,0,.13);transform-origin:0 0;pointer-events:none}
  .fr{padding:0 12px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:74px}
  @media (max-width:720px){ .lbl,.fr,#track .sec,#track .tk i{display:none} #track .secs{height:0;border:0} #track .ticks,#prog{top:0} .tc{min-width:0;padding:0 10px} .btn{min-width:40px;padding:0 9px} }
  @media (max-width:420px){ .tc .dur{display:none} }
</style>
</head>

  </button>
  <button class="btn" id="bRestart" title="Restart (Home)" aria-label="Restart">

(async function(){
"use strict";

/* ==========================================================================
   MOTION LANGUAGE
   --------------------------------------------------------------------------
   The logo is treated as a heavy physical object on a strict 12-column grid.
   It never drifts and never fades. It is either travelling fast, stopped dead,
   or cut. Colour only changes on hard cuts (tl.set), never by tween.
   Holds are where the tension lives; the moves are short and violent.

   Named eases (all hand-written, registered with gsap.registerEase):

   snap   1-(1-t)^6       ~90% of the distance in the first third, then a dead
                          stop. Grid-step moves: feels like a machine indexing
                          to the next column.
   slam   custom          reaches target at ~25%, overshoots 7%, recoils and
                          parks by 70%. Arrivals and impacts: the object has
                          mass and hits something.
   whip   t^4             pure acceleration, no landing. Exits that end on a
                          cut, the move is interrupted rather than finished.
   drive  linear + 8% run-up   conveyor motion for the strip section: constant
                          velocity with a hard stop at the end, no ease-out.
   crash  expo-in         exponential zoom: perceived as constant speed that
                          suddenly explodes. Used to dive into letterforms.
   creep  t^1.8           barely-there pressure during holds (1-4% scale).
                          Nobody should consciously see it move.

   No stock in/out easing, no bounce, no elastic.
   ========================================================================== */
const clamp01 = t => t < 0 ? 0 : t > 1 ? 1 : t;
gsap.registerEase("snap",  t => 1 - Math.pow(1 - t, 6));
gsap.registerEase("slam",  t => {
  if (t < 0.4) { const u = t / 0.4; return 1.07 * (1 - Math.pow(1 - u, 3)); }  // hit & overshoot
  if (t < 0.7) { const u = (t - 0.4) / 0.3; return 1.07 - 0.07 * u * u * (3 - 2 * u); } // recoil
  return 1;                                                                       // parked
});
gsap.registerEase("whip",  t => t * t * t * t);
gsap.registerEase("drive", t => t < 0.08 ? (t / 0.08) * (t / 0.08) * 0.04 : 0.04 + (t - 0.08) * (0.96 / 0.92));
gsap.registerEase("crash", t => t === 0 ? 0 : (Math.pow(2, 10 * (t - 1)) - 0.0009765625) / 0.9990234375);
gsap.registerEase("creep", t => Math.pow(t, 1.8));

/* ------------------------------------------------------------------ palette */
const K = 0, R = 1, WH = 2;
const COL = ["#0b0b0b", "#ff0000", "#f1ece2"];

/* ------------------------------------------------------ load + trace logo */
const img = new Image();
img.src = LOGO_SRC;
await img.decode();
const LW = img.naturalWidth, LH = img.naturalHeight;
const src = document.createElement("canvas");
src.width = LW; src.height = LH;
const sctx = src.getContext("2d", { willReadFrequently: true });
sctx.drawImage(img, 0, 0);
const px = sctx.getImageData(0, 0, LW, LH).data;
const A = new Float32Array(LW * LH);
for (let i = 0; i < LW * LH; i++) A[i] = px[i * 4 + 3] / 255;

// Marching squares over the alpha field -> closed contour loops (logo px units).
function trace(T = 0.5) {
  const W2 = LW + 2, H2 = LH + 2, f = new Float32Array(W2 * H2);
  for (let y = 0; y < LH; y++) for (let x = 0; x < LW; x++) f[(y + 1) * W2 + x + 1] = A[y * LW + x];
  const F = (i, j) => f[j * W2 + i];
  const hE = (i, j) => 2 * (j * W2 + i), vE = (i, j) => 2 * (j * W2 + i) + 1;
  const pt = new Map(), segs = [];
  const P = e => {
    if (pt.has(e)) return;
    const k = e >> 1, i = k % W2, j = (k / W2) | 0;
    if (e & 1) { const a = F(i, j), b = F(i, j + 1); pt.set(e, [i - .5, j + (T - a) / (b - a) - .5]); }
    else       { const a = F(i, j), b = F(i + 1, j); pt.set(e, [i + (T - a) / (b - a) - .5, j - .5]); }
  };
  const add = (a, b) => { segs.push(a, b); P(a); P(b); };
  for (let j = 0; j < H2 - 1; j++) for (let i = 0; i < W2 - 1; i++) {
    const c = (F(i, j) > T) | (F(i + 1, j) > T) << 1 | (F(i + 1, j + 1) > T) << 2 | (F(i, j + 1) > T) << 3;
    if (c === 0 || c === 15) continue;
    const top = hE(i, j), right = vE(i + 1, j), bottom = hE(i, j + 1), left = vE(i, j);
    switch (c) {
      case 1: case 14: add(left, top); break;
      case 2: case 13: add(top, right); break;
      case 3: case 12: add(left, right); break;
      case 4: case 11: add(right, bottom); break;
      case 6: case 9:  add(top, bottom); break;
      case 7: case 8:  add(left, bottom); break;
      default: {
        const ctr = (F(i, j) + F(i + 1, j) + F(i + 1, j + 1) + F(i, j + 1)) / 4 > T;
        if ((c === 5) === ctr) { add(top, right); add(left, bottom); } else { add(left, top); add(right, bottom); }
      }
    }
  }
  const byEdge = new Map(), n = segs.length / 2, used = new Uint8Array(n), loops = [];
  for (let s = 0; s < n; s++) for (const e of [segs[2 * s], segs[2 * s + 1]]) {
    const l = byEdge.get(e); l ? l.push(s) : byEdge.set(e, [s]);
  }
  for (let s0 = 0; s0 < n; s0++) {
    if (used[s0]) continue;
    used[s0] = 1;
    const start = segs[2 * s0]; let cur = segs[2 * s0 + 1], s = s0;
    const loop = [...pt.get(start)];
    while (cur !== start) {
      loop.push(...pt.get(cur));
      const l = byEdge.get(cur), nx = l[0] === s ? l[1] : l[0];
      if (nx === undefined || used[nx]) break;
      used[nx] = 1; s = nx;
      cur = segs[2 * nx] === cur ? segs[2 * nx + 1] : segs[2 * nx];
    }
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (let k = 0; k < loop.length; k += 2) {
      x0 = Math.min(x0, loop[k]); x1 = Math.max(x1, loop[k]);
      y0 = Math.min(y0, loop[k + 1]); y1 = Math.max(y1, loop[k + 1]);
    }
    loops.push({ pts: loop, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 });
  }
  return loops;
}
const loops = trace();

// Occupancy runs: bands (AFTER / HOURS / 24:7) by empty rows, letters by empty columns.
function runs(occ, minGap) {
  const out = []; let s = -1, lastOn = -1e9;
  for (let i = 0; i < occ.length; i++) {
    if (!occ[i]) continue;
    if (s < 0) s = i; else if (i - lastOn > minGap) { out.push([s, lastOn + 1]); s = i; }
    lastOn = i;
  }
  if (s >= 0) out.push([s, lastOn + 1]);
  return out;
}
const on = (x, y) => A[y * LW + x] > 0.5;
const rowOcc = []; for (let y = 0; y < LH; y++) { let o = 0; for (let x = 0; x < LW && !o; x++) o = on(x, y); rowOcc.push(o); }
let bandRows = runs(rowOcc, 3);
if (bandRows.length !== 3) bandRows = [[0, LH * .31 | 0], [LH * .31 | 0, LH * .62 | 0], [LH * .62 | 0, LH]]; // fallback split
const box = (x0, y0, x1, y1) => ({ x0, y0, x1, y1, w: x1 - x0, h: y1 - y0, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 });
const BANDS = bandRows.map(([y0, y1]) => {
  const occ = []; for (let x = 0; x < LW; x++) { let o = 0; for (let y = y0; y < y1 && !o; y++) o = on(x, y); occ.push(o); }
  const cols = runs(occ, 1);
  return { ...box(cols[0][0], y0, cols[cols.length - 1][1], y1), letters: cols.map(([a, b]) => box(a, y0, b, y1)) };
});

// Parts: 0 = whole logo, 1..3 = bands, 10*(b+1)+k = letter k of band b.
const PARTS = new Map(), RECTS = new Map();
function mkPart(id, test, rect) {
  const p = new Path2D();
  for (const L of loops) if (test(L)) {
    const q = L.pts; p.moveTo(q[0], q[1]);
    for (let k = 2; k < q.length; k += 2) p.lineTo(q[k], q[k + 1]);
    p.closePath();
  }
  PARTS.set(id, p); RECTS.set(id, rect);
}
mkPart(0, () => true, box(0, 0, LW, LH));
BANDS.forEach((b, bi) => {
  mkPart(bi + 1, L => L.cy >= b.y0 && L.cy < b.y1, box(0, b.y0 - .5, LW, b.y1 + .5));
  b.letters.forEach((l, k) => mkPart(10 * (bi + 1) + k, L => L.cy >= b.y0 && L.cy < b.y1 && L.cx >= l.x0 - .5 && L.cx < l.x1 + .5,
    box(l.x0 - .5, b.y0 - .5, l.x1 + .5, b.y1 + .5)));
});
const band = i => BANDS[i];
const letter = (b, k) => BANDS[b].letters[Math.min(k, BANDS[b].letters.length - 1)];

// Tinted copies of the untouched bitmap, for the P (raw pixels) comparison mode.
const TINT = COL.map(c => {
  const t = document.createElement("canvas"); t.width = LW; t.height = LH;
  const x = t.getContext("2d"); x.drawImage(img, 0, 0);
  x.globalCompositeOperation = "source-in"; x.fillStyle = c; x.fillRect(0, 0, LW, LH);
  return t;
});
let RAW = false;

/* --------------------------------------------------------------- canvas */
const cv = document.getElementById("comp");
const ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
function size() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const r = cv.getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
}

/* ---------------------------------------------------------------- state
   Everything the timeline animates. Think of each object as a layer in a comp. */
const NI = 10;
const instDefault = () => ({
  on: 0, part: 0,
  u: LW / 2, v: LH / 2,        // anchor point, in logo px
  x: 0, y: 0,                  // where the anchor sits on screen
  s: 1, sx: 1, sy: 1, r: 0,    // scale (screen px per logo px), stretch, rotation (deg)
  c: R, world: 0,              // colour index; 1 = parented to the world (rotating grid)
  mask: -1, mk: 1,             // track matte: index of another instance, 1 = inside, -1 = outside
  sc: 0, k0: 0, k1: 0, k2: 1, k3: 1,              // screen-space crop (fractions of comp)
  lc: 0, q0: 0, q1: 0, q2: LW, q3: LH             // logo-space crop (logo px)
});
const S = {
  bg:    { c: K },
  cam:   { x: 0, y: 0, s: 1 },
  world: { r: 0, sx: 1, sy: 1 },
  inst:  Array.from({ length: NI }, instDefault)
};

/* ------------------------------------------------------------ renderer */
let camM, worldM, base;
function mats() {
  const c = S.cam, w = S.world;
  base = new DOMMatrix().scale(DPR, DPR);
  camM = new DOMMatrix().translate(W / 2 + c.x, H / 2 + c.y).scale(c.s, c.s).translate(-W / 2, -H / 2);
  worldM = new DOMMatrix().translate(W / 2, H / 2).rotate(w.r).scale(w.sx, w.sy).translate(-W / 2, -H / 2);
}
function instM(o) {
  let m = base.multiply(camM);
  if (o.world) m = m.multiply(worldM);
  return m.translate(o.x, o.y).rotate(o.r).scale(o.s * o.sx, o.s * o.sy).translate(-o.u, -o.v);
}
const partOf = o => PARTS.get(Math.round(o.part)) || PARTS.get(0);

function drawInst(o) {
  if (!o.on) return;
  ctx.save();
  if (o.sc) {
    ctx.setTransform(base.multiply(camM));
    ctx.beginPath(); ctx.rect(o.k0 * W, o.k1 * H, (o.k2 - o.k0) * W, (o.k3 - o.k1) * H); ctx.clip();
  }
  if (o.mask >= 0) {
    const h = S.inst[o.mask];
    if (h.on) {
      const p = new Path2D();
      if (o.mk < 0) p.rect(0, 0, cv.width, cv.height);
      p.addPath(partOf(h), instM(h));
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clip(p, "evenodd");
    }
  }
  ctx.setTransform(instM(o));
  if (o.lc) { ctx.beginPath(); ctx.rect(o.q0, o.q1, o.q2 - o.q0, o.q3 - o.q1); ctx.clip(); }
  const c = Math.round(o.c);
  if (RAW) {
    const rc = RECTS.get(Math.round(o.part)) || RECTS.get(0);
    ctx.beginPath(); ctx.rect(rc.x0, rc.y0, rc.w, rc.h); ctx.clip();
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(TINT[c], 0, 0);
  } else {
    ctx.fillStyle = COL[c];
    ctx.fill(partOf(o), "evenodd");
  }
  ctx.restore();
}

// Only the logo is ever drawn. The column grid exists purely as positioning maths in build().
function render() {
  mats();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = COL[Math.round(S.bg.c)];
  ctx.fillRect(0, 0, cv.width, cv.height);
  for (const o of S.inst) drawInst(o);
}

/* ---------------------------------------------------------------- score */
const DUR = 12;
const SECTIONS = [
  [0, 2, "01", "MACRO"], [2, 4, "02", "TRAVEL"], [4, 6, "03", "COLLIDE"],
  [6, 7.6, "04", "BREAK"], [7.6, 9.85, "05", "HOLD"], [9.85, 12, "06", "RESOLVE"]
];

function build() {
  const cols = W >= H ? 12 : 6;
  const m = W / cols;                                      // the grid: positioning only, never drawn
  const cx = W / 2, cy = H / 2;
  const g = v => Math.round(v / m) * m;                      // snap to column line
  const I = S.inst;
  const b0 = band(0), b1 = band(1), b2 = band(2);
  const fitS = Math.min(H * 0.74 / LH, W * 0.84 / LW);

  const tl = gsap.timeline({ paused: true, repeat: -1, onUpdate: render });
  const $ = (t, o, v) => tl.set(o, v, t);
  const to = (t, d, o, v, ease = "snap") => tl.to(o, { ...v, duration: d, ease }, t);
  const cut = (t, c) => $(t, S.bg, { c });
  const put = (t, i, v) => $(t, I[i], { ...instDefault(), on: 1, ...v }); // full-state set: no leakage between shots
  const off = (t, ...ids) => ids.forEach(i => $(t, I[i], { on: 0 }));
  const shake = (t, a) => [[a, -a * .6], [-a * .7, a * .45], [a * .4, a * .3], [-a * .2, -a * .15], [0, 0]]
    .forEach(([x, y], i) => $(t + i / 25, S.cam, { x, y }));  // stepped on the 25fps frame grid, not smoothed

  // Frame 0 == frame 300. The macro crop the whole loop dives back into.
  const aR = letter(0, 4);
  const S0 = { part: 0, u: aR.x0 + aR.w * 0.5, v: aR.y0 + aR.h * 0.46, x: cx, y: cy, s: H / 22, c: R };

  // ---- reset every layer at 0
  cut(0, K);
  $(0, S.cam, { x: 0, y: 0, s: 1 });
  $(0, S.world, { r: 0, sx: 1, sy: 1 });
  I.forEach((o, i) => i ? $(0, o, instDefault()) : put(0, 0, S0));

  /* 01 · MACRO  00:00–02:00 --------------------------------------------
     No intro. We're already inside the R of AFTER. Shapes, not words.
     Every move indexes along the column grid. */
  to(0.00, 0.30, I[0], { x: cx - 2 * m });
  to(0.38, 0.26, I[0], { x: cx - 4 * m, y: cy - m });
  to(0.72, 0.22, I[0], { x: cx - 7 * m });
  const b2crop = { u: b2.x0 + b2.w * 0.43, v: b2.y0 + b2.h * 0.52 };
  put(0.42, 1, { part: 3, ...b2crop, x: cx + 2 * m, y: H * 2.2, s: H / 17, c: WH });
  to(0.42, 0.26, I[1], { y: cy - m }, "slam");
  shake(0.5, 9);
  cut(0.95, R); $(0.95, I[0], { c: K });                     // palette flip on the cut
  to(1.00, 0.26, I[0], { y: cy + 2 * m, x: cx - 5 * m });
  to(0.98, 0.30, I[1], { x: W * 2.8 }, "whip");
  const aH = letter(1, 0);
  put(1.22, 2, { part: 2, u: aH.cx, v: aH.cy, x: -W * 1.2, y: cy, s: H / 42, c: WH });
  to(1.22, 0.24, I[2], { x: cx - m }, "slam");
  shake(1.3, 7);
  $(1.55, I[0], { s: H / 44 });                              // scale jump: a cut, not a zoom
  to(1.55, 0.2, I[2], { x: cx + 3 * m });
  cut(1.74, K); $(1.74, I[0], { c: R });
  to(1.76, 0.2, I[0], { y: cy - 2 * m, x: cx - 2 * m });
  to(1.80, 0.2, I[2], { x: -W * 1.6 }, "whip");

  /* 02 · TRAVEL  02:00–04:00 ---------------------------------------------
     Oversized bands travel on the (invisible) column grid, locked to it. */
  cut(2.0, WH); off(2.0, 0, 1, 2);
  const sA = H * 1.2 / b0.h, bwA = b0.w * sA;
  put(2.0, 0, { part: 1, u: b0.x0, v: b0.cy, x: W + m, y: g(cy) + m * .5, s: sA, c: R });
  to(2.04, 0.30, I[0], { x: g(W - 3 * m) }, "slam");
  to(2.42, 0.30, I[0], { x: g(W * 0.25 - bwA * 0.3) });
  to(2.80, 0.26, I[0], { x: g(-bwA * 0.62) });
  to(3.14, 0.22, I[0], { x: -bwA - W * 0.3 }, "whip");
  const sHr = 3 * m / b1.h, lenH = b1.w * sHr;
  put(2.28, 1, { part: 2, u: b1.cx, v: b1.cy, r: 90, x: 2.5 * m, y: H + lenH * .6, s: sHr, c: K });
  to(2.28, 0.30, I[1], { y: g(H * 0.7) }, "slam");
  to(2.72, 0.28, I[1], { y: g(H * 0.25) });
  to(3.12, 0.24, I[1], { y: -lenH }, "whip");
  cut(3.0, R); $(3.0, I[0], { c: WH }); $(3.0, I[1], { c: K });
  const s2 = H * 1.5 / b2.h;
  put(3.08, 2, { part: 3, u: b2.cx, v: b2.cy, x: W * 2.4, y: cy, r: -15, s: s2, c: WH });
  to(3.08, 0.24, I[2], { x: cx + m }, "slam");
  shake(3.16, 12);
  cut(3.5, K);
  $(3.5, I[2], { s: s2 * 1.9, u: b2.x0 + b2.w * 0.28, c: R }); // re-crop on the cut
  to(3.60, 0.2, I[2], { y: cy - 2 * m, x: cx - 2 * m });
  to(3.80, 0.2, I[2], { y: -H * 2 }, "whip");

  /* 03 · COLLIDE  04:00–06:00 ------------------------------------------
     Three strips, three words, opposing directions. Then the logo becomes a
     matte for itself. Then AFTER and HOURS are thrown into each other. */
  cut(4.0, K); off(4.0, 0, 1, 2);
  const st = (b, f) => (H / 3) / b.h * f;
  put(4.0, 3, { part: 1, u: b0.cx, v: b0.cy, x: W * 1.8,  y: H / 6,     s: st(b0, 1.02), c: R,  sc: 1, k1: 0,     k3: 1 / 3 });
  put(4.0, 4, { part: 2, u: b1.cx, v: b1.cy, x: -W * .8,  y: H / 2,     s: st(b1, 1.02), c: WH, sc: 1, k1: 1 / 3, k3: 2 / 3 });
  put(4.0, 5, { part: 3, u: b2.cx, v: b2.cy, x: W * 1.8,  y: H * 5 / 6, s: st(b2, 1.02), c: R,  sc: 1, k1: 2 / 3, k3: 1 });
  to(4.00, 0.18, I[3], { x: cx + m }, "slam");
  to(4.06, 0.18, I[4], { x: cx - m }, "slam");
  to(4.12, 0.18, I[5], { x: cx }, "slam");
  to(4.20, 0.52, I[3], { x: cx - 3 * m }, "drive");
  to(4.26, 0.46, I[4], { x: cx + 3 * m }, "drive");
  to(4.32, 0.40, I[5], { x: cx - 2 * m }, "drive");
  to(4.44, 0.14, I[3], { k3: 0.13 });
  to(4.44, 0.14, I[4], { k1: 0.13, k3: 0.87 });
  to(4.44, 0.14, I[5], { k1: 0.87 });
  cut(4.44, WH); $(4.44, I[3], { c: K }); $(4.44, I[5], { c: K });
  $(4.44, I[4], { s: H * 0.95 / b1.h, c: R });                // scale jump inside the widened strip

  cut(4.72, WH); off(4.72, 3, 4, 5);
  put(4.72, 6, { part: 0, x: cx, y: cy, s: H * 1.12 / LH, c: R });
  put(4.72, 7, { part: 0, x: cx - m, y: H * 1.7, s: H * 0.42 / LH, c: K, mask: 6, mk: 1 });
  to(4.72, 0.58, I[7], { y: -H * 0.7 }, "drive");
  $(4.88, I[6], { s: H * 2.3 / LH, u: b1.cx, v: b1.cy });   // host punches in: hard cut
  $(5.03, I[6], { s: H * 4.2 / LH, u: letter(1, 1).cx, v: b1.cy, r: 90 });
  cut(5.03, K); $(5.03, I[7], { mk: -1, c: WH });            // matte flips: now outside the letterform
  $(5.16, I[6], { s: H * 1.5 / LH, u: LW / 2, v: LH / 2, r: 0 });
  $(5.16, I[7], { mk: 1, c: K });

  cut(5.3, R); off(5.3, 6, 7);
  const sc0 = H * 0.4 / b0.h, sc1 = H * 0.4 / b1.h;
  put(5.3, 3, { part: 1, u: b0.x1, v: b0.cy, x: -W * 0.3, y: cy, s: sc0, c: K });
  put(5.3, 4, { part: 2, u: b1.x0, v: b1.cy, x: W * 1.3,  y: cy, s: sc1, c: WH });
  to(5.3, 0.16, I[3], { x: cx }, "slam");
  to(5.3, 0.16, I[4], { x: cx }, "slam");
  shake(5.38, 16);
  cut(5.46, K); $(5.46, I[3], { c: R });
  to(5.56, 0.2, I[3], { y: -H * 0.7 }, "whip");
  to(5.56, 0.2, I[4], { y: H * 1.7 }, "whip");
  put(5.62, 5, { part: 3, u: b2.cx, v: b2.cy, x: cx, y: H * 2, s: H * 0.9 / b2.h, c: R });
  to(5.62, 0.18, I[5], { y: cy }, "slam");
  to(5.84, 0.05, I[5], { s: H * 1.9 / b2.h });               // punch
  to(5.89, 0.11, I[5], { s: H * 1.05 / b2.h }, "slam");

  /* 04 · BREAK  06:00–07:60 --------------------------------------------
     HOURS splits into letters, each owning a column. Then the world rotates,
     the columns stretch, and the type is pushed past legibility. Two scale
     punches. Then everything is gone. */
  cut(6.0, WH); off(6.0, 5);
  const sL = H * 0.62 / b1.h;
  const offs = [-3, 2, -1, 3, -2], offs2 = [2, -2, 3, -3, 1];
  b1.letters.slice(0, 5).forEach((l, k) => {
    put(6.0, 3 + k, { part: 20 + k, u: b1.cx, v: b1.cy, x: cx, y: cy + offs[k] * m, s: sL, c: k === 2 ? R : K, world: 1 });
    to(6.02 + k * 0.035, 0.2, I[3 + k], { y: cy });
    to(6.95 + k * 0.03, 0.22, I[3 + k], { y: cy + offs2[k] * m * 1.4 });
  });
  to(6.30, 0.26, S.world, { r: -24 }, "slam");
  shake(6.36, 8);
  to(6.62, 0.22, S.world, { sx: 2.8, sy: 0.7 });
  cut(6.9, K);
  b1.letters.slice(0, 5).forEach((l, k) => $(6.9, I[3 + k], { c: k === 2 ? WH : R }));
  to(6.92, 0.28, S.world, { r: 90, sx: 0.5, sy: 3.4 }, "slam");
  cut(7.24, R);
  b1.letters.slice(0, 5).forEach((l, k) => $(7.24, I[3 + k], { c: k === 2 ? WH : K }));
  to(7.24, 0.05, S.cam, { s: 2.7 });                          // punch 1
  to(7.29, 0.12, S.cam, { s: 1.12 }, "slam");
  cut(7.44, K);
  b1.letters.slice(0, 5).forEach((l, k) => $(7.44, I[3 + k], { c: k === 2 ? R : WH }));
  to(7.44, 0.04, S.cam, { s: 5.5 });                          // punch 2
  to(7.48, 0.08, S.cam, { s: 1 });

  /* 05 · HOLD  07:60–09:85 ---------------------------------------------
     Remove almost everything. One tiny crop of the 7, parked off-axis
     against open ground. One single-cell jump halfway. Wait. */
  cut(7.6, WH); off(7.6, 3, 4, 5, 6, 7);
 $(7.6, S.world, { r: 0, sx: 1, sy: 1 }); $(7.6, S.cam, { x: 0, y: 0, s: 1 });
  const f7 = { q0: b2.x0 + b2.w * 0.72, q1: b2.y0 - 1, q2: b2.x1 + 1, q3: b2.y0 + b2.h * 0.76 };
  const sf = m * 0.5 / (f7.q3 - f7.q1);
  const fx = g(W * (W >= H ? 0.78 : 0.7)) + m / 2, fy = Math.round(H * 0.22 / m) * m + m / 2;
  put(7.6, 8, { part: 0, lc: 1, ...f7, u: (f7.q0 + f7.q2) / 2, v: (f7.q1 + f7.q3) / 2, x: fx, y: fy, s: sf, c: R });
  to(7.6, 1.25, I[8], { s: sf * 1.04 }, "creep");
  $(8.85, I[8], { x: fx - m });                               // one cell. no tween.
  cut(9.6, K); $(9.6, I[8], { c: WH });
  to(9.62, 0.22, I[8], { s: sf * 70, x: cx, y: cy }, "crash");

  /* 06 · RESOLVE  09:85–12:00 ------------------------------------------
     AFTER from above, HOURS from the left, 24:7 from below: three impacts,
     one logo. Two-frame inversion on contact. Hold with confidence.
     Then re-anchor on frame-0's crop point and crash-zoom back in. */
  cut(9.85, K); off(9.85, 8);
  const hero = { u: LW / 2, v: LH / 2, x: cx, y: cy, s: fitS, c: R };
  put(9.85, 3, { ...hero, part: 1, y: cy - H * 1.3 });
  put(9.85, 4, { ...hero, part: 2, x: cx - W * 1.4 });
  put(9.85, 5, { ...hero, part: 3, y: cy + H * 1.4 });
  to(9.85, 0.16, I[3], { y: cy }, "slam");
  to(9.93, 0.16, I[4], { x: cx }, "slam");
  to(10.0, 0.18, I[5], { y: cy }, "slam");
  cut(10.06, R); [3, 4, 5].forEach(i => $(10.06, I[i], { c: K }));
  shake(10.06, 14);
  cut(10.14, K); [3, 4, 5].forEach(i => $(10.14, I[i], { c: R }));
  off(10.24, 3, 4, 5);
  put(10.24, 0, { ...hero, part: 0 });                        // invisible swap to the single whole asset
  const sHold = fitS * 1.025;
  to(10.24, 1.06, I[0], { s: sHold }, "creep");
  // re-anchor onto S0's point without moving a pixel
  $(11.3, I[0], { u: S0.u, v: S0.v, x: cx + (S0.u - LW / 2) * sHold, y: cy + (S0.v - LH / 2) * sHold });
  to(11.3, 0.2, I[0], { s: sHold * 0.92 });                  // pull back: anticipation
  to(11.5, 0.5, I[0], { s: S0.s, x: S0.x, y: S0.y }, "crash"); // lands exactly on frame 0

  tl.set({}, {}, DUR);                                        // pin duration to exactly 12.00s
  return tl;
}

/* ------------------------------------------------------------- transport */
let tl = null;
const $id = id => document.getElementById(id);
const bPlay = $id("bPlay"), track = $id("track"), cti = $id("cti"), prog = $id("prog");
const tNow = $id("tNow"), tFr = $id("tFr");

function paintTrack() {
  const secs = $id("secs"), ticks = $id("ticks");
  secs.innerHTML = SECTIONS.map(s =>
    `<div class="sec" style="left:${s[0] / DUR * 100}%;width:${(s[1] - s[0]) / DUR * 100}%">${s[2]} ${s[3]}</div>`).join("");
  let h = "";
  for (let i = 0; i <= DUR * 4; i++) {
    const t = i / 4, sec = i % 4 === 0;
    h += `<div class="tk${sec ? " s" : ""}" style="left:${t / DUR * 100}%">${sec && i < DUR * 4 ? `<i>${String(t).padStart(2, "0")}</i>` : ""}</div>`;
  }
  ticks.innerHTML = h;
}
function syncUI() {
  if (!tl) return;
  const t = tl.time();
  const w = track.clientWidth;
  cti.style.transform = `translateX(${(t / DUR) * w}px)`;
  prog.style.transform = `scaleX(${t / DUR})`;
  tNow.textContent = t.toFixed(2).padStart(5, "0") + "s";
  tFr.textContent = "F " + String(Math.min(299, Math.floor(t * 25 + 1e-6))).padStart(3, "0");
  track.setAttribute("aria-valuenow", t.toFixed(2));
  const playing = !tl.paused();
  $id("icPause").style.display = playing ? "" : "none";
  $id("icPlay").style.display = playing ? "none" : "";
}
gsap.ticker.add(syncUI);

bPlay.onclick = () => { tl.paused(!tl.paused()); };
$id("bRestart").onclick = () => { tl.restart(); };
function speed(v) {
  tl.timeScale(v);
  $id("bQ").classList.toggle("on", v === 0.25);
  $id("b1").classList.toggle("on", v === 1);
}
$id("bQ").onclick = () => speed(0.25);
$id("b1").onclick = () => speed(1);

// Scrubber drives the master timeline directly.
let scrubbing = false, resume = false;
const seekTo = t => { tl.time(Math.max(0, Math.min(DUR - 1e-4, t)), false); render(); syncUI(); };
const seekX = e => { const r = track.getBoundingClientRect(); seekTo((e.clientX - r.left) / r.width * DUR); };
track.addEventListener("pointerdown", e => {
  scrubbing = true; resume = !tl.paused(); tl.pause();
  track.setPointerCapture(e.pointerId); seekX(e);
});
track.addEventListener("pointermove", e => { if (scrubbing) seekX(e); });
const endScrub = () => { if (!scrubbing) return; scrubbing = false; if (resume) tl.play(); };
track.addEventListener("pointerup", endScrub);
track.addEventListener("pointercancel", endScrub);

window.addEventListener("keydown", e => {
  if (e.target.tagName === "BUTTON" && (e.code === "Space" || e.code === "Enter")) return;
  const F = 1 / 25;
  if (e.code === "Space") { e.preventDefault(); tl.paused(!tl.paused()); }
  else if (e.code === "ArrowRight") { tl.pause(); seekTo(tl.time() + (e.shiftKey ? 10 * F : F)); }
  else if (e.code === "ArrowLeft")  { tl.pause(); seekTo(tl.time() - (e.shiftKey ? 10 * F : F)); }
  else if (e.code === "Home") { tl.restart(); }
  else if (e.code === "KeyP") { RAW = !RAW; render(); }
});

// Resize = rebuild the comp at the new dimensions, same playhead, same state.
function rebuild() {
  const t = tl ? tl.time() : 0, paused = tl ? tl.paused() : false, ts = tl ? tl.timeScale() : 1;
  if (tl) tl.kill();
  size();
  tl = build();
  tl.timeScale(ts);
  tl.time(t, false);
  render();
  if (!paused) tl.play();
}
let rz;
window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(rebuild, 60); });

paintTrack();
rebuild();
window.__ident = { get tl() { return tl; }, render, S, BANDS };
})();
</script>
