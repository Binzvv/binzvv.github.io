<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>After Hours 24:7</title>
<style>
  :root { --bg: #000; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000; } }
  :root[data-theme="dark"] { --bg: #000; }
  html, body { margin: 0; background: var(--bg); }
  body { height: 700vh; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .lenis.lenis-smooth { scroll-behavior: auto !important; }
  ::-webkit-scrollbar { display: none; }
  html { scrollbar-width: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
(() => {
  gsap.registerPlugin(ScrollTrigger);

  // ---- Space -------------------------------------------------------------
  // Camera rests at z = D. A plane at depth z is scaled by (D - z) / D, so from
  // the rest position every plane projects back onto the 1920x1080 artwork.
  const D = 2000, W = 1920, H = 1080;
  const PLANES = [
    // order = paint order (back to front)
    { src: 'assets/bg.png',   z: -4200 },
    { src: 'assets/mid.png',  z: 0 },
    { src: 'assets/fg.png',   z: 1450 },
    { src: 'assets/logo.png', z: 1250, rect: { x: 828, y: 364, w: 262, h: 350 }, logo: true },
  ];

  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.setClearColor(0x000000, 1);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 16 / 9, 1, 30000);
  const loader = new THREE.TextureLoader();
  const maxAniso = renderer.capabilities.getMaxAnisotropy();
  const meshes = [];

  // Coarse distance field (in artwork px) from each layer's alpha, so the
  // pointer's attraction builds with proximity instead of switching on/off.
  function distField(img) {
    const gw = 160, gh = 90, c = document.createElement('canvas');
    c.width = gw; c.height = gh;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, gw, gh);
    const px = ctx.getImageData(0, 0, gw, gh).data, d = new Float32Array(gw * gh);
    for (let i = 0; i < d.length; i++) d[i] = px[i * 4 + 3] > 128 ? 0 : 1e9;
    const R = Math.SQRT2, at = (x, y) => (x < 0 || y < 0 || x >= gw || y >= gh) ? 1e9 : d[y * gw + x];
    for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
      const i = y * gw + x;
      d[i] = Math.min(d[i], at(x - 1, y) + 1, at(x, y - 1) + 1, at(x - 1, y - 1) + R, at(x + 1, y - 1) + R);
    }
    for (let y = gh - 1; y >= 0; y--) for (let x = gw - 1; x >= 0; x--) {
      const i = y * gw + x;
      d[i] = Math.min(d[i], at(x + 1, y) + 1, at(x, y + 1) + 1, at(x + 1, y + 1) + R, at(x - 1, y + 1) + R);
    }
    return { gw, gh, d, cell: W / gw };
  }

  PLANES.forEach((p, i) => {
    const r = p.rect || { x: 0, y: 0, w: W, h: H };
    const s = (D - p.z) / D;
    const mat = new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, depthTest: false, toneMapped: false });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(r.w * s, r.h * s), mat);
    const tex = loader.load(p.src, t => { if (!p.logo) mesh.userData.field = distField(t.image); });
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = maxAniso;
    mat.map = tex;
    mesh.position.set((r.x + r.w / 2 - W / 2) * s, -(r.y + r.h / 2 - H / 2) * s, p.z);
    mesh.renderOrder = i;
    mesh.userData = { z: p.z, span: D - p.z, base: mesh.position.clone(), logo: !!p.logo,
                      push: 0, pv: 0, eff: 0, field: null };
    scene.add(mesh);
    meshes.push(mesh);
  });
  const photos = meshes.filter(m => !m.userData.logo).reverse(); // front -> back
  const logo = meshes.find(m => m.userData.logo);

  // Fit the whole artwork (contain) at the rest position.
  function resize() {
    const w = innerWidth, h = innerHeight, a = w / h;
    renderer.setSize(w, h, false);
    camera.aspect = a;
    const halfH = a >= W / H ? H / 2 : (W / a) / 2;
    baseFov = THREE.MathUtils.radToDeg(2 * Math.atan(halfH / D));
    camera.updateProjectionMatrix();
  }
  let baseFov = 30;
  addEventListener('resize', resize);
  resize();

  // ---- Scroll: Lenis -> ScrollTrigger -> GSAP timeline --------------------
  const lenis = new Lenis({ lerp: 0.085, wheelMultiplier: 0.9, smoothWheel: true });
  lenis.on('scroll', ScrollTrigger.update);
  gsap.ticker.add(t => lenis.raf(t * 1000));
  gsap.ticker.lagSmoothing(0);

  // Camera rig driven by the master choreography. The photography never
  // animates on scroll; only the logo is allowed to travel with the camera
  // for a beat (logoLag) before the camera rushes through it.
  const rig = { z: D, x: 0, y: 0, logoLag: 0 };
  const tl = gsap.timeline({ paused: true, defaults: { ease: 'none' } });
  // 00 still -> 01 depth
  tl.to(rig, { z: 1780, duration: 0.8, ease: 'sine.in' })
  // 02 enter: foreground grows enormous and passes beyond the viewport;
  //    the logo starts travelling with us, holding its place
    .to(rig, { z: 1440, logoLag: 320, duration: 1.0, ease: 'power1.in' })
  // 03 the signal lets go: slow, then the camera rushes through it
    .to(rig, { z: 880, duration: 0.9, ease: 'power3.in' })
  // 04 immersion: the midground becomes the environment
    .to(rig, { z: 330, x: -60, y: -220, duration: 1.4, ease: 'none' })
  // 05 pass through: out the other side, inside the deep field
    .to(rig, { z: -1800, x: -150, y: -700, duration: 1.8, ease: 'power2.out' });

  ScrollTrigger.create({
    trigger: document.body, start: 'top top', end: 'bottom bottom', scrub: true,
    onUpdate: self => { tl.progress(self.progress); },
  });

  // ---- Pointer ------------------------------------------------------------
  const ptr = { tx: 0, ty: 0, x: 0, y: 0, vx: 0, vy: 0, px: -1, py: -1, inside: false };
  let energy = 0;
  addEventListener('pointermove', e => {
    ptr.tx = (e.clientX / innerWidth) * 2 - 1;
    ptr.ty = (e.clientY / innerHeight) * 2 - 1;
    if (ptr.inside) energy = Math.min(1.6, energy + Math.hypot(e.clientX - ptr.px, e.clientY - ptr.py) * 0.0035);
    ptr.px = e.clientX; ptr.py = e.clientY; ptr.inside = true;
  });
  document.addEventListener('pointerleave', () => { ptr.tx = 0; ptr.ty = 0; ptr.inside = false; });

  const target = new THREE.Vector3(), rayDir = new THREE.Vector3(0, 0, -1);
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  const pull = { x: 0, y: 0, z: 0, s: 0, tx: 0, ty: 0, tz: 0 };
  const logoS = { x: 0, y: 0, vx: 0, vy: 0, k: 1, kv: 0 };
  let fovKick = 0, lastVel = 0;
  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const mix = (a, b, t) => a + (b - a) * t;

  function frame() {
    energy *= 0.94;
    // camera-orbit spring: trails the pointer, drifts on after it stops
    ptr.vx += (ptr.tx - ptr.x) * 0.014; ptr.vx *= 0.87; ptr.x += ptr.vx;
    ptr.vy += (ptr.ty - ptr.y) * 0.014; ptr.vy *= 0.87; ptr.y += ptr.vy;

    // Hero: whatever photograph you are drawn to steers the camera into it
    // once you start scrolling. Zero weight at scroll 0 keeps rest exact.
    // The camera flies a straight line from rest toward the attracting point,
    // arriving as it reaches that plane's depth.
    pull.x += (pull.tx - pull.x) * 0.035; pull.y += (pull.ty - pull.y) * 0.035; pull.z += (pull.tz - pull.z) * 0.035;
    const pw = pull.s * 0.9 * Math.min(1, (D - rig.z) / Math.max(1, D - pull.z));
    const depthIn = 1 - smooth(D, -1800, rig.z) * 0.5;
    const cx = mix(rig.x, pull.x, pw), cy = mix(rig.y, pull.y, pw);
    camera.position.set(cx + ptr.x * 150 * depthIn, cy - ptr.y * 90 * depthIn, rig.z);
    target.set(mix(rig.x * 1.15, pull.x, pw * 0.5), mix(rig.y * 1.15, pull.y, pw * 0.5), -4200);
    camera.lookAt(target);
    camera.rotateZ(-ptr.vx * 0.6);

    // lens: slight off-axis shift with the pointer + scroll-velocity breathing
    camera.filmOffset = ptr.x * 0.9;
    const v = lenis.velocity || 0;
    lastVel += (v - lastVel) * 0.08;
    fovKick += (Math.min(Math.abs(lastVel) * 0.06, 2.2) - fovKick) * 0.1;
    camera.fov = baseFov + fovKick;
    camera.updateProjectionMatrix();
    camera.updateMatrixWorld();

    // ---- proximity: raycast the pointer into each photographic plane ----
    ndc.set(ptr.tx, -ptr.ty);
    ray.setFromCamera(ndc, camera);
    if (ptr.inside) rayDir.copy(ray.ray.direction);
    let remaining = 1, maxEff = 0, focus = null;
    for (const m of photos) {
      const u = m.userData;
      let a = 0, inside = 0;
      if (ptr.inside && u.field && u.z < rig.z - 40) {
        const hit = ray.intersectObject(m)[0];
        if (hit) {
          const f = u.field, gx = Math.min(f.gw - 1, hit.uv.x * f.gw | 0), gy = Math.min(f.gh - 1, (1 - hit.uv.y) * f.gh | 0);
          const dpx = f.d[gy * f.gw + gx] * f.cell;
          a = 1 - smooth(0, 190, dpx);           // approach -> attraction
          inside = 1 - smooth(0, 24, dpx);
          u.hit = hit.point;
        }
      }
      u.eff = a * remaining;                   // front layers claim the pointer first
      remaining *= 1 - inside;
      if (u.eff > maxEff) { maxEff = u.eff; focus = m; }
    }
    if (focus) { const h = focus.userData.hit; pull.tx = h.x; pull.ty = h.y; pull.tz = h.z; }
    pull.s += (maxEff - pull.s) * 0.05;

    // ---- push / recede springs (fast pointer = more tension + overshoot) ----
    const k = 0.055 + energy * 0.05, damp = 0.8 - energy * 0.04;
    for (const m of photos) {
      const u = m.userData;
      const t = u.eff * (0.3 + energy * 0.14) - (maxEff - u.eff) * 0.08;
      u.pv += (t - u.push) * k; u.pv *= damp; u.push += u.pv;
      const dist = Math.max(0, rig.z - u.z);
      // travel along the pointer ray: the spot under the cursor stays put
      // and the plane swells toward the viewer around it
      m.position.copy(u.base).addScaledVector(rayDir, -u.push * dist);
    }

    // ---- logo: magnetic, tiny overshoot, holds with the camera, then passes ----
    {
      const u = logo.userData, lz = u.z - rig.logoLag;
      const sc = (D - lz) / (D - u.z);
      let tx = 0, ty = 0, ks = 1;
      if (ptr.inside && ray.ray.direction.z < 0) {
        const t = (lz - ray.ray.origin.z) / ray.ray.direction.z;
        if (t > 0) {
          const hx = ray.ray.origin.x + ray.ray.direction.x * t, hy = ray.ray.origin.y + ray.ray.direction.y * t;
          const dx = hx - u.base.x * sc, dy = hy - u.base.y * sc, dd = Math.hypot(dx, dy) / sc;
          const mg = 1 - smooth(90, 420, dd);
          tx = dx * 0.07 * mg; ty = dy * 0.07 * mg; ks = 1 + 0.035 * mg;
        }
      }
      logoS.vx += (tx - logoS.x) * 0.06; logoS.vx *= 0.78; logoS.x += logoS.vx;
      logoS.vy += (ty - logoS.y) * 0.06; logoS.vy *= 0.78; logoS.y += logoS.vy;
      logoS.kv += (ks - logoS.k) * 0.08; logoS.kv *= 0.75; logoS.k += logoS.kv;
      logo.position.set(u.base.x * sc + logoS.x, u.base.y * sc + logoS.y, lz);
      logo.scale.setScalar(sc * logoS.k);
    }

    // as the camera reaches a plane, soften it out instead of a hard clip
    for (const m of meshes) {
      const rel = (rig.z - m.position.z) / m.userData.span;
      m.material.opacity = smooth(0.025, 0.14, rel);
      m.visible = rel > 0.025;
    }

    renderer.render(scene, camera);
  }
  gsap.ticker.add(frame);

  // start at the artwork
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  scrollTo(0, 0);
})();
</script>
</body>
</html>
