<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>After Hours 24:7</title>
<style>
  :root { --bg: #000; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #000; } }
  :root[data-theme="dark"] { --bg: #000; }
  html, body { margin: 0; background: var(--bg); }
  body { height: 700vh; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .lenis.lenis-smooth { scroll-behavior: auto !important; }
  ::-webkit-scrollbar { display: none; }
  html { scrollbar-width: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
(() => {
  gsap.registerPlugin(ScrollTrigger);

  // ---- Space -------------------------------------------------------------
  // Camera rests at z = D. A plane at depth z is scaled by (D - z) / D, so from
  // the rest position every plane projects back onto the 1920x1080 artwork.
  const D = 2000, W = 1920, H = 1080;
  const PLANES = [
    // order = paint order (back to front)
    { src: 'assets/bg.png',   z: -2600 },
    { src: 'assets/mid.png',  z: 0 },
    { src: 'assets/fg.png',   z: 1100 },
    // logo sits just behind the foreground photographs, so the off-centre
    // photography leaves frame first and the signal holds a beat longer.
    { src: 'assets/logo.png', z: 820, rect: { x: 828, y: 364, w: 262, h: 350 }, logo: true },
  ];

  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.setClearColor(0x000000, 1);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 16 / 9, 1, 20000);
  const loader = new THREE.TextureLoader();
  const maxAniso = renderer.capabilities.getMaxAnisotropy();
  const meshes = [];

  PLANES.forEach((p, i) => {
    const tex = loader.load(p.src);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = maxAniso;
    const r = p.rect || { x: 0, y: 0, w: W, h: H };
    const s = (D - p.z) / D;
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, depthTest: false, toneMapped: false });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(r.w * s, r.h * s), mat);
    mesh.position.set((r.x + r.w / 2 - W / 2) * s, -(r.y + r.h / 2 - H / 2) * s, p.z);
    mesh.renderOrder = i;
    mesh.userData = { z: p.z, base: mesh.position.clone(), logo: !!p.logo };
    scene.add(mesh);
    meshes.push(mesh);
  });

  // Fit the whole artwork (contain) at the rest position.
  function resize() {
    const w = innerWidth, h = innerHeight, a = w / h;
    renderer.setSize(w, h, false);
    camera.aspect = a;
    const halfH = a >= W / H ? H / 2 : (W / a) / 2;
    baseFov = THREE.MathUtils.radToDeg(2 * Math.atan(halfH / D));
    camera.updateProjectionMatrix();
  }
  let baseFov = 30;
  addEventListener('resize', resize);
  resize();

  // ---- Scroll: Lenis -> ScrollTrigger -> GSAP timeline --------------------
  const lenis = new Lenis({ lerp: 0.085, wheelMultiplier: 0.9, smoothWheel: true });
  lenis.on('scroll', ScrollTrigger.update);
  gsap.ticker.add(t => lenis.raf(t * 1000));
  gsap.ticker.lagSmoothing(0);

  // Camera rig driven by the master choreography. Everything here is camera;
  // no plane is ever animated.
  const rig = { z: D, x: 0, y: 0 };
  const tl = gsap.timeline({ paused: true, defaults: { ease: 'none' } });
  // 00 still -> 01 depth: slow creep, depth becomes perceptible
  tl.to(rig, { z: 1700, duration: 1, ease: 'sine.in' })
  // 02 enter: approach the foreground plane, it slides off the frame edges
    .to(rig, { z: 1060, duration: 1.2, ease: 'none' })
  // 03 immersion: pass the logo, midground takes over
    .to(rig, { z: 350, x: -40, y: -180, duration: 1.4, ease: 'none' })
  // 04 pass: through the midground, settle inside the deep field
    .to(rig, { z: -100, x: -110, y: -520, duration: 1.6, ease: 'power1.out' });

  ScrollTrigger.create({
    trigger: document.body, start: 'top top', end: 'bottom bottom', scrub: true,
    onUpdate: self => { tl.progress(self.progress); },
  });

  // ---- Pointer: spring with inertia (slight overshoot, never snaps) -------
  const ptr = { tx: 0, ty: 0, x: 0, y: 0, vx: 0, vy: 0 };
  const logoS = { x: 0, y: 0, vx: 0, vy: 0 };
  addEventListener('pointermove', e => {
    ptr.tx = (e.clientX / innerWidth) * 2 - 1;
    ptr.ty = (e.clientY / innerHeight) * 2 - 1;
  });
  document.addEventListener('pointerleave', () => { ptr.tx = 0; ptr.ty = 0; });

  const target = new THREE.Vector3();
  let fovKick = 0, lastVel = 0;
  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  function frame() {
    // spring: k / damping tuned so motion trails the pointer and drifts on
    ptr.vx += (ptr.tx - ptr.x) * 0.012; ptr.vx *= 0.88; ptr.x += ptr.vx;
    ptr.vy += (ptr.ty - ptr.y) * 0.012; ptr.vy *= 0.88; ptr.y += ptr.vy;

    // viewpoint moves around the installation; it keeps looking at the deep
    // field, so background barely moves and near planes swing further.
    const depthIn = 1 - smooth(D, -100, rig.z) * 0.5;
    camera.position.set(rig.x + ptr.x * 70 * depthIn, rig.y - ptr.y * 42 * depthIn, rig.z);
    target.set(rig.x * 1.15, rig.y * 1.15, -2600);
    camera.lookAt(target);
    camera.rotateZ(-ptr.vx * 0.9); // hint of roll from pointer velocity only

    // Surprise: scroll velocity breathes the lens — a fraction of a degree.
    const v = lenis.velocity || 0;
    lastVel += (v - lastVel) * 0.08;
    fovKick += (Math.min(Math.abs(lastVel) * 0.06, 2.2) - fovKick) * 0.1;
    camera.fov = baseFov + fovKick;
    camera.updateProjectionMatrix();

    for (const m of meshes) {
      const u = m.userData;
      if (u.logo) {
        // the signal: restrained, independent, lags the photography a touch
        logoS.vx += (-ptr.x * 6 - logoS.x) * 0.02; logoS.vx *= 0.86; logoS.x += logoS.vx;
        logoS.vy += (ptr.y * 4 - logoS.y) * 0.02; logoS.vy *= 0.86; logoS.y += logoS.vy;
        m.position.x = u.base.x + logoS.x;
        m.position.y = u.base.y + logoS.y;
      }
      // as the camera reaches a plane, soften it out instead of a hard clip
      const dist = rig.z - u.z;
      m.material.opacity = smooth(40, 320, dist);
      m.visible = dist > 40;
    }

    renderer.render(scene, camera);
  }
  gsap.ticker.add(frame);

  // start at the artwork
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  scrollTo(0, 0);
})();
</script>
</body>
</html>
