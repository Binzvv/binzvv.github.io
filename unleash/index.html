<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Unleash Your Energy</title>
  <meta name="description" content="An interactive energy experience." />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Unleash" />
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; height: 100%; background: #000; overflow: hidden;
      overscroll-behavior: none; touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    }
    body { position: fixed; inset: 0; }
    #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #hud {
      position: fixed; left: 16px; right: 16px;
      bottom: calc(14px + env(safe-area-inset-bottom));
      display: flex; justify-content: space-between; gap: 12px;
      font: 500 9px/1.3 ui-monospace, "SF Mono", Menlo, monospace;
      letter-spacing: 0.14em; color: rgba(206, 255, 0, 0.55);
      pointer-events: none; mix-blend-mode: screen;
    }
    #hud .fps { color: rgba(255, 255, 255, 0.3); white-space: nowrap; }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="hud"><span class="label"></span><span class="fps"></span></div>

  <script src="vendor/gsap.min.js"></script>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
