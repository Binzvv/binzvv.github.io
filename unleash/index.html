<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>NRC · Energy in Motion</title>
  <meta name="description" content="An unofficial, speculative Nike Run Club concept." />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NRC Energy" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <link rel="icon" type="image/png" href="assets/icon-192.png" />
  <link rel="preload" href="fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles/app.css" />
</head>
<body>
  <canvas id="gl" aria-hidden="true"></canvas>

  <main id="app" data-state="boot">
    <!-- Anticipation -->
    <section class="screen home" data-screen="home" aria-label="Run">
      <header class="top fade">
        <img class="swoosh" src="assets/swoosh.png" width="1464" height="512" alt="Nike" />
      </header>
      <div class="intro">
        <p class="eyebrow fade">Outdoor Run</p>
        <h1 class="title fade">Ready when<br />you are.</h1>
      </div>
      <div class="start-wrap">
        <button class="start" id="startBtn" type="button"><span>Start Run</span></button>
      </div>
      <p class="note fade">Unofficial concept · Not affiliated with Nike</p>
    </section>

    <!-- Countdown -->
    <section class="screen count" data-screen="count" aria-live="assertive">
      <div class="count-num" id="countNum"></div>
    </section>

    <!-- Payoff + afterglow -->
    <section class="screen live" data-screen="live" aria-label="Run in progress">
      <header class="top in">
        <img class="swoosh" src="assets/swoosh.png" width="1464" height="512" alt="Nike" />
      </header>
      <div class="live-center">
        <div class="timer in" id="timer" aria-label="Elapsed time">00:00</div>
        <p class="timer-label in">Outdoor Run</p>
      </div>
      <button class="reset in" id="resetBtn" type="button">Reset</button>
    </section>
  </main>

  <script src="vendor/gsap.min.js"></script>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
